<svg viewBox="0 0 400 800" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <!-- Фоновый (основной) экран, приглушённый, со всеми элементами включая "Я правильно поняла?" -->
  <rect width="400" height="800" fill="#ffffff" stroke="#000" stroke-width="2"/>

  <text x="200" y="50" font-size="18" text-anchor="middle" fill="#ccc" font-weight="bold">Что хочу</text>
  <rect x="30" y="60" width="280" height="60" rx="10" fill="#f7f7f7" stroke="#ddd" stroke-width="1.5"/>
  <rect x="320" y="60" width="50" height="60" rx="10" fill="#ddd"/>

  <rect x="30" y="135" width="340" height="50" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>

  <text x="200" y="228" font-size="18" text-anchor="middle" fill="#ccc" font-weight="bold">Я правильно поняла?</text>
  <rect x="30" y="238" width="340" height="70" rx="6" fill="#f7f7f7"/>

  <rect x="30" y="320" width="160" height="45" rx="8" fill="#ddd"/>
  <rect x="210" y="320" width="160" height="45" rx="8" fill="#ddd"/>

  <rect x="20" y="680" width="360" height="55" rx="6" fill="#f7f7f7"/>
  <rect x="100" y="750" width="200" height="40" rx="8" fill="#ddd"/>

  <!-- Затемняющий оверлей -->
  <rect width="400" height="800" fill="#000000" opacity="0.45"/>

  <!-- Карточка загрузки по центру -->
  <rect x="70" y="330" width="260" height="180" rx="16" fill="#ffffff"/>

  <!-- Анимация (спиннер) -->
  <circle cx="200" cy="400" r="28" fill="none" stroke="#e0e0e0" stroke-width="6"/>
  <path d="M 200 372 A 28 28 0 0 1 228 400" fill="none" stroke="#3a7bd5" stroke-width="6" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" from="0 200 400" to="360 200 400" dur="1s" repeatCount="indefinite"/>
  </path>

  <text x="200" y="455" font-size="14" text-anchor="middle" fill="#333" font-weight="bold">Создаём результат...</text>
  <text x="200" y="478" font-size="11" text-anchor="middle" fill="#888">Это займёт немного времени</text>
</svg>
