<svg viewBox="0 0 400 650" xmlns="http://www.w3.org/2000/svg" font-family="Roboto, Arial, sans-serif">
  <rect width="400" height="650" fill="#FFFBFE"/>

  <text x="200" y="70" font-size="22" text-anchor="middle" fill="#1C1B1F" font-weight="bold">Вход</text>

  <!-- Google -->
  <rect x="30" y="110" width="340" height="60" rx="16" fill="#EEF2FE" stroke="#5B8DEF" stroke-width="1"/>
  <circle cx="65" cy="140" r="12" fill="#fff" stroke="#ddd"/>
  <text x="65" y="145" font-size="12" text-anchor="middle" fill="#5B8DEF" font-weight="bold">G</text>
  <text x="205" y="145" font-size="14" text-anchor="middle" fill="#1C1B1F">Продолжить с Google</text>

  <!-- Телефон -->
  <rect x="30" y="185" width="340" height="60" rx="16" fill="#EEF2FE" stroke="#5B8DEF" stroke-width="1"/>
  <text x="205" y="220" font-size="14" text-anchor="middle" fill="#1C1B1F">📱  Войти по номеру телефона</text>

  <!-- Email -->
  <rect x="30" y="260" width="340" height="60" rx="16" fill="#EEF2FE" stroke="#5B8DEF" stroke-width="1"/>
  <text x="205" y="295" font-size="14" text-anchor="middle" fill="#1C1B1F">✉️  Войти по email</text>

  <!-- разделитель -->
  <line x1="30" y1="345" x2="370" y2="345" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Кнопка "Продолжить как гость" -->
  <rect x="90" y="375" width="220" height="45" rx="16" fill="none" stroke="#5B8DEF" stroke-width="1.5"/>
  <text x="200" y="402" font-size="13" text-anchor="middle" fill="#5B8DEF" font-weight="bold">Продолжить без регистрации</text>
</svg>
