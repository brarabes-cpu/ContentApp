<svg viewBox="0 0 400 800" xmlns="http://www.w3.org/2000/svg" font-family="Roboto, Arial, sans-serif">
  <rect width="400" height="800" fill="#FFFBFE"/>

  <!-- Единый синий, чуть светлее -->
  <!-- #5B8DEF основной синий -->

  <text x="200" y="55" font-size="20" text-anchor="middle" fill="#1C1B1F" font-weight="bold">Что хочу</text>

  <!-- Поле ввода промта — единый стиль полей -->
  <rect x="25" y="65" width="290" height="65" rx="16" fill="#EEF2FE" stroke="#5B8DEF" stroke-width="1"/>
  <text x="42" y="102" font-size="12" fill="#7C89A6">например: собачка на траве</text>

  <!-- Кнопка Enter — единый стиль кнопок -->
  <rect x="325" y="65" width="50" height="65" rx="16" fill="#5B8DEF"/>
  <text x="350" y="102" font-size="14" text-anchor="middle" fill="#fff">➜</text>

  <!-- Кнопка приложить фото — тот же стиль, что остальные кнопки (обводка) -->
  <rect x="25" y="145" width="350" height="55" rx="16" fill="#EEF2FE" stroke="#5B8DEF" stroke-width="1"/>
  <text x="200" y="178" font-size="14" text-anchor="middle" fill="#2B3A67">📎  Приложить фото</text>

  <text x="200" y="245" font-size="19" text-anchor="middle" fill="#1C1B1F" font-weight="bold">Я правильно поняла?</text>

  <!-- Окно с развёрнутым промтом — тот же стиль поля ввода -->
  <rect x="25" y="258" width="350" height="70" rx="16" fill="#EEF2FE" stroke="#5B8DEF" stroke-width="1"/>
  <text x="42" y="278" font-size="10" fill="#49454F">Собака породы лабрадор бежит по</text>
  <text x="42" y="292" font-size="10" fill="#49454F">зелёной траве, ясный день, солнце...</text>

  <!-- Обе кнопки выбора — единый стиль, один синий, залитые -->
  <rect x="25" y="345" width="165" height="55" rx="16" fill="#5B8DEF"/>
  <text x="107" y="378" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold">Сделать как я хочу</text>

  <rect x="210" y="345" width="165" height="55" rx="16" fill="#5B8DEF"/>
  <text x="292" y="378" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold">Сделать как ты поняла</text>

  <!-- Плашка регистрации -->
  <rect x="20" y="690" width="360" height="55" rx="12" fill="#FFF8E1" stroke="#E6C260" stroke-width="1"/>
  <text x="200" y="713" font-size="11.5" text-anchor="middle" fill="#7A5C00">Для улучшения качества,</text>
  <text x="200" y="729" font-size="11.5" text-anchor="middle" fill="#7A5C00">необходимо зарегистрироваться</text>

  <!-- Кнопка "Войти" — тот же стиль, что все кнопки -->
  <rect x="90" y="755" width="220" height="45" rx="16" fill="#5B8DEF"/>
  <text x="200" y="783" font-size="15" text-anchor="middle" fill="#fff" font-weight="bold">Войти</text>
</svg>
