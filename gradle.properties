# Project-wide Gradle settings.

# AndroidX — обязательно для всех современных зависимостей (Compose, Navigation и т.п.)
android.useAndroidX=true
android.enableJetifier=false

# Kotlin code style
kotlin.code.style=official

# Включить AndroidX resource shrinking / non-transitive R classes (быстрее сборка)
android.nonTransitiveRClass=true

# JVM args для Gradle daemon
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
